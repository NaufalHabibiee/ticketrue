    position:relative;overflow:hidden;

    background:#0c2d50;color:#e8f2ff;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .sweep{
    position:absolute;inset:-30%;pointer-events:none;
    background:conic-gradient(from 0deg,transparent 0deg,#F9A12B14 26deg,transparent 70deg,transparent 360deg);
    animation:sweep 9s linear infinite;
  }
  @keyframes sweep{to{transform:rotate(360deg)}}
  .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(46% 40% at 50% 30%,#F9A12B17,transparent 70%)}
  .card{position:relative;width:100%;max-width:520px;text-align:center;padding:56px 40px 44px}
  .logo{display:inline-flex;align-items:center;gap:9px;margin-bottom:44px}
  .logo svg{width:24px;height:24px;fill:none;stroke:#F9A12B;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .logo span{font-size:21px;font-weight:800;color:#e8f2ff;letter-spacing:-.01em}
  .logo span i{font-style:normal;color:#F9A12B}

  .radar{position:relative;width:104px;height:104px;display:grid;place-items:center;margin:0 auto 26px}
  .ring{position:absolute;inset:0;margin:auto;width:66px;height:66px;border-radius:50%;border:1.5px solid #F9A12B;opacity:0;animation:ping 2.8s cubic-bezier(.2,.6,.35,1) infinite}
  .ring.r2{animation-delay:.9s}
  .ring.r3{animation-delay:1.8s}
  @keyframes ping{0%{transform:scale(.7);opacity:.5}75%{opacity:0}100%{transform:scale(1.9);opacity:0}}
  .mark{position:relative;z-index:2;width:68px;height:68px;border-radius:50%;background:#0c2d50;box-shadow:0 0 0 1px #ffffff1f;display:grid;place-items:center;animation:tilt 4.5s ease-in-out infinite}
  @keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  .mark svg{width:30px;height:30px;fill:none;stroke:#F9A12B;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  .code{font:600 10.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.22em;text-transform:uppercase;color:#F9A12B;margin-bottom:14px}
  h1{font-size:27px;font-weight:800;line-height:1.28;margin-bottom:12px}
  p{color:#b9d0ea;font-size:15px;line-height:1.6;max-width:380px;margin:0 auto 30px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:#F9A12B;color:#092950;font-weight:700;font-size:14.5px;
    padding:13px 24px;border-radius:999px;text-decoration:none;
    transition:background .15s,transform .15s;
  }
  .btn:hover{background:#ffb54e;transform:translateY(-1px)}
  .btn svg{transition:transform .15s}
  .btn:hover svg{transform:translateX(2px)}

  .barcode{margin:34px auto 0;width:176px;height:26px;background:repeating-linear-gradient(90deg,#e8f2ff 0 2px,transparent 2px 4px,#e8f2ff 4px 6px,transparent 6px 8px,#e8f2ff 8px 9px,transparent 9px 12px);opacity:.4}
  .ticket-note{margin-top:12px;font:500 10.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:#5f85ae}

  @media(prefers-reduced-motion:reduce){.sweep,.ring,.mark{animation:none;opacity:.5}}
</style>
